<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · Past digests</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0b1020; color: #eef2ff; }
      a { color: #a5b4fc; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .wrap { max-width: 840px; margin: 0 auto; padding: 28px 18px 60px; }
      .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; margin-top: 14px; }
      .row { display:flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.08); }
      .row:first-child { border-top: none; }
      .muted { color: #c7d2fe; opacity: 0.9; font-size: 13px; }
      .pill { display:inline-block; font-size: 12px; color: #c7d2fe; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); padding: 5px 8px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <h1 style="margin:0; font-size: 20px;">Past digests</h1>
        <a class="pill" href="/">Latest</a>
      </div>

      <div class="card">
        {% if not digests or digests|length == 0 %}
          <div class="muted">No digests yet.</div>
        {% else %}
          {% for d in digests %}
            <div class="row">
              <div><a href="/digests/{{ d.date }}">{{ d.date }}</a></div>
              <div class="muted">{{ d.created_at }}</div>
            </div>
          {% endfor %}
        {% endif %}
      </div>
    </div>
  </body>
</html>
